name: Generate trophy card

on:
  schedule:
    - cron: "0 0 * * 1"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate trophy.svg
        uses: SMNFL/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          file: dist/trophy.svg
          token: ${{ secrets.TOKEN_PAT }}
          theme: kimbie_dark
          max-rows: 1
          margin-width: 8
          margin-height: 8
          no-background: true
          no-frame: true

      - name: Push trophy.svg to trophy-output
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist

          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b trophy-output
          git add trophy.svg
          git commit -m "Update trophy card"

          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push --force origin trophy-output
